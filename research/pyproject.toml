[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "puzzle_vision"
version = "0.0.1"
description = "Data \u0026 research part of Engineering Thesis"
authors = [
  { name = "Krzysztof Wyrzykowski" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "opencv-python-headless>=5.0.0.93",
    "pandas",
    "pillow>=12.3.0",
    "python-dotenv",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["puzzle_vision"]

[tool.ruff.lint]
extend-select = [
    "I",    # sorting imports
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # code simplification
    "NPY",  # legacy numpy API
    "RUF",  # ruff rules
]

[tool.ruff.lint.isort]
known-first-party = ["puzzle_vision"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"] # allow imports in all notebook cells

[tool.pyright]
include = ["puzzle_vision", "scripts", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.uv]
constraint-dependencies = ["pyopenssl>=24"]

[dependency-groups]
dev = [
    "dvc[gdrive]>=3.67.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "rubiktwophase>=1.1.1",
    "ruff>=0.16.10",
]
